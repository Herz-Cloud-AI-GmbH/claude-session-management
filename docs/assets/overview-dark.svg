<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" role="img" aria-label="Within every session a pre-compaction hook keeps open questions and running work. Across sessions Design runs on Opus, Lead on Sonnet and Subagents on Haiku.">
