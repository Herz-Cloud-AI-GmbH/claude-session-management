  <text x="979.0" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#34d399">Haiku · max</text>
  <line x1="352.0" y1="248.0" x2="467.0" y2="248.0" stroke="#64748b" stroke-width="2" marker-end="url(#head)"/>
  <text x="410.5" y="236.0" text-anchor="middle" font-size="11.5" fill="#94a3b8">written design</text>
  <line x1="731.0" y1="248.0" x2="846.0" y2="248.0" stroke="#64748b" stroke-width="2" marker-end="url(#head)"/>
  <text x="789.5" y="236.0" text-anchor="middle" font-size="11.5" fill="#94a3b8">tasks</text>
