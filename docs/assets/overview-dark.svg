  <text x="221.0" y="468" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">Work</text>
  <text x="221.0" y="494" text-anchor="middle" font-size="12.5" fill="#94a3b8">the context grows</text>
  <text x="221.0" y="524" text-anchor="middle" font-size="12.5" font-weight="700" fill="#94a3b8">window 280k</text>
