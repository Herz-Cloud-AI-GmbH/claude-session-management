  <text x="221.0" y="254" text-anchor="middle" font-size="12.5" fill="#94a3b8">one topic, writes the design</text>
  <text x="221.0" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a78bfa">Opus · xhigh</text>
  <rect x="475.0" y="192" width="250" height="112" rx="14" fill="#0b2433" stroke="#22d3ee" stroke-width="2"/>
  <text x="600.0" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">Lead</text>
  <text x="600.0" y="254" text-anchor="middle" font-size="12.5" fill="#94a3b8">merges and releases</text>
  <text x="600.0" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22d3ee">Sonnet · xhigh</text>
  <rect x="854.0" y="192" width="250" height="112" rx="14" fill="#0c2b24" stroke="#34d399" stroke-width="2"/>
