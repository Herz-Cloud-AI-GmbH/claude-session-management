  <text x="979.0" y="524" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fb7185">kept every time</text>
  <line x1="352.0" y1="488.0" x2="467.0" y2="488.0" stroke="#64748b" stroke-width="2" marker-end="url(#head)"/>
