  <text x="84" y="65" font-size="26" font-weight="700" fill="#0f172a">Claude session management</text>
  <text x="84" y="92" font-size="14" fill="#475569">Context that lasts, and one model per role</text>
  <rect x="48" y="124" width="1104" height="224" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="82" cy="160" r="5" fill="#7c3aed"/>
