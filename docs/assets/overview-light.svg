  <text x="600.0" y="524" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">.claude/settings.json</text>
  <rect x="854.0" y="432" width="250" height="112" rx="14" fill="#ffe9ee" stroke="#e11d48" stroke-width="2"/>
  <text x="979.0" y="468" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Summary</text>
