  <text x="221.0" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Design</text>
  <text x="221.0" y="254" text-anchor="middle" font-size="12.5" fill="#475569">one topic, writes the design</text>
  <text x="221.0" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c3aed">Opus · xhigh</text>
  <rect x="475.0" y="192" width="250" height="112" rx="14" fill="#e6f9fd" stroke="#0891b2" stroke-width="2"/>
  <text x="600.0" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Lead</text>
  <text x="600.0" y="254" text-anchor="middle" font-size="12.5" fill="#475569">merges and releases</text>
  <text x="600.0" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0891b2">Sonnet · xhigh</text>
  <rect x="854.0" y="192" width="250" height="112" rx="14" fill="#e4f8ef" stroke="#059669" stroke-width="2"/>
  <text x="979.0" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Subagents</text>
