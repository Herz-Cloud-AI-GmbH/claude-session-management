  <text x="979.0" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#059669">Haiku · max</text>
  <line x1="352.0" y1="248.0" x2="467.0" y2="248.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#head)"/>
  <text x="410.5" y="236.0" text-anchor="middle" font-size="11.5" fill="#475569">written design</text>
  <line x1="731.0" y1="248.0" x2="846.0" y2="248.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#head)"/>
  <text x="789.5" y="236.0" text-anchor="middle" font-size="11.5" fill="#475569">tasks</text>
  <rect x="48" y="364" width="1104" height="224" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="82" cy="400" r="5" fill="#b45309"/>
  <text x="98" y="405" font-size="13" font-weight="700" letter-spacing="1.5" fill="#0f172a">WITHIN EVERY SESSION</text>
  <rect x="96.0" y="432" width="250" height="112" rx="14" fill="#eef2f7" stroke="#64748b" stroke-width="2"/>
  <text x="221.0" y="468" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Work</text>
  <text x="221.0" y="494" text-anchor="middle" font-size="12.5" fill="#475569">the context grows</text>
  <text x="221.0" y="524" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">window 280k</text>
  <rect x="475.0" y="432" width="250" height="112" rx="14" fill="#fff5dc" stroke="#b45309" stroke-width="2"/>
